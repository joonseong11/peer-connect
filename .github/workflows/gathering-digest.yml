name: Send Gathering Digest

on:
  schedule:
    # 매일 UTC 22:00 = KST 07:00 (다음날)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call gathering digest endpoint
        run: |
          curl -f -X POST ${{ secrets.APP_URL }}/api/cron/gathering-digest || exit 1
        env:
          APP_URL: ${{ secrets.APP_URL }}

      - name: Log completion
        if: success()
        run: echo "Gathering digest sent successfully at $(date)"

      - name: Log failure
        if: failure()
        run: echo "Failed to send gathering digest at $(date)"
